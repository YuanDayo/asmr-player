name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: 版本一致性校验（不过就不构建、不发布）
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python scripts/check_version.py "${GITHUB_REF_NAME}"
          else
            python scripts/check_version.py
          fi

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 用固定密钥库签名：历史正式版的证书指纹是 0261c2ee…，换成别的 key 就覆盖安装失败。
      - name: 准备签名密钥
        env:
          SIGNING_STORE_BASE64: ${{ secrets.SIGNING_STORE_BASE64 }}
        run: |
          if [ -z "${SIGNING_STORE_BASE64}" ]; then
            echo "::error::缺少仓库 Secret SIGNING_STORE_BASE64，拒绝构建（无密钥签出来的包装不上）"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/signing"
          printf '%s' "${SIGNING_STORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/signing/release.jks"
          echo "SIGNING_STORE_FILE=${RUNNER_TEMP}/signing/release.jks" >> "$GITHUB_ENV"

      - name: 单元测试
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: 构建 APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: 校验签名指纹
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "产物: $APK"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "证书 SHA-256: $ACTUAL"
          EXPECTED="0261c2eef3800390887b99035228864d50bed0f75e96782471db7d2cc7cd5500"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::签名指纹 $ACTUAL 与历史版本 $EXPECTED 不一致，这样的包装不到已安装用户身上"
            exit 1
          fi

      - name: 收集产物
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/ || true
          ls -l out

      - name: 作为构建产物上传
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

  # 只在 Tag 触发时建 Release：描述一律从 CHANGELOG 提取，不再手写。
  # 已经存在的 Release 跳过（本地先发过的情况），不会覆盖。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 从 CHANGELOG 提取发布说明
        run: python scripts/extract_changelog.py "${GITHUB_REF_NAME}" > release_notes.md

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: out

      - name: 判断是否已有同名 Release
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_REF_NAME} 的 Release 已存在，跳过创建"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 Release
        if: steps.exists.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          # Tag 里带 -（beta/alpha/rc）就是预发布；纯正式版 Tag 才是 Latest
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          files: out/*.apk
