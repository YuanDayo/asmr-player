name: Release APK

# Tag 推送 → 校验 → 单测 → 用固定密钥签 release 包 → 校验指纹与元数据 → 自动建 Release
# 手动触发（workflow_dispatch）只跑到「构建 + 校验」，不会建 Release，用来验证签名链路。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 默认只读；只有 publish job 额外要 contents: write
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 版本脚本自测（SemVer 比较）
        run: python scripts/test_semver.py
      - name: 版本一致性校验（不过就不构建、不发布）
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python scripts/check_version.py "${GITHUB_REF_NAME}" --release
            python scripts/extract_changelog.py "${GITHUB_REF_NAME}" --check
          else
            python scripts/check_version.py
          fi

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 固定密钥库签名：历史正式版证书指纹是 0261c2ee…，换成别的 key 就覆盖安装失败。
      - name: 校验签名 Secret 并还原密钥库
        env:
          SIGNING_STORE_BASE64: ${{ secrets.SIGNING_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGNING_STORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少仓库 Secret ${name}，拒绝构建（无密钥签出来的包装不上）"
              exit 1
            fi
          done
          mkdir -p "${RUNNER_TEMP}/signing"
          printf '%s' "${SIGNING_STORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/signing/kiite-release.jks"
          test -s "${RUNNER_TEMP}/signing/kiite-release.jks"
          echo "SIGNING_STORE_FILE=${RUNNER_TEMP}/signing/kiite-release.jks" >> "$GITHUB_ENV"

      - name: 单元测试
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: 构建 release APK（禁止 debug 回退）
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease -PrequireReleaseSigning=true --no-daemon --console=plain

      - name: 校验 APK 数量与签名证书
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          [ "${#apks[@]}" -eq 1 ] || { echo "::error::期望恰好 1 个 release APK，实际 ${#apks[@]} 个"; exit 1; }
          apk="${apks[0]}"
          echo "产物: $apk"
          expected="0261c2eef3800390887b99035228864d50bed0f75e96782471db7d2cc7cd5500"

          # 一、用仓库自带解析器（纯 Python，不依赖 Java）读证书指纹
          actual="$(python scripts/apk_cert.py "$apk" | sed -n 's/^cert SHA-256 = //p' | tr -d ':' | tr 'A-Z' 'a-z')"
          echo "自解析证书: ${actual:-<空>}"
          [ "$actual" = "$expected" ] || {
            echo "::error::证书指纹 ${actual:-<空>} 与历史版本 $expected 不一致，这样的包装不到已安装用户身上"
            exit 1
          }

          # 二、再用官方 apksigner 独立验一次（顺带确认签名方案本身通过）
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -n "$signer" ] && [ -x "$signer" ]; then
            if ! "$signer" verify --print-certs "$apk" > certs.txt 2>&1; then
              echo "::error::apksigner 校验未通过"
              cat certs.txt
              exit 1
            fi
            head -n 5 certs.txt
            sig="$(sed -n 's/^Signer #1 certificate SHA-256 digest: *//p' certs.txt | head -n 1 | tr -d ':' | tr 'A-Z' 'a-z')"
            echo "apksigner 证书: ${sig:-<空>}"
            [ "$sig" = "$expected" ] || { echo "::error::apksigner 读出的指纹与期望值不符"; exit 1; }
          else
            echo "::warning::没找到 apksigner，仅凭自解析结果放行"
          fi

      - name: 校验 APK 内版本号与 Gradle 一致
        shell: bash
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          want_name=$(sed -n 's/^val appVersionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          want_code=$(sed -n 's/^val appVersionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts)
          aapt=$(find "$ANDROID_HOME/build-tools" -type f \( -name aapt2 -o -name aapt \) | sort -V | tail -n 1)
          badging=$("$aapt" dump badging "$apk")
          got_code=$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)
          got_name=$(printf '%s\n' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)
          echo "APK: versionName=${got_name} versionCode=${got_code}（期望 ${want_name} / ${want_code}）"
          [ "$got_name" = "$want_name" ] || { echo "::error::APK versionName 不符"; exit 1; }
          [ "$got_code" = "$want_code" ] || { echo "::error::APK versionCode 不符"; exit 1; }

      - name: 生成 SHA-256 并收集产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$apk" out/
          ( cd out && sha256sum ./*.apk > "${GITHUB_REF_NAME:-local}-sha256.txt" )
          cat out/*-sha256.txt
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*
          if-no-files-found: error

  # 只在 Tag 触发时建 Release：描述一律从 CHANGELOG 提取，不再手写。
  # 已经存在的 Release 一律不覆盖（只跳过并留下提示）。
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 从 CHANGELOG 提取发布说明
        run: python scripts/extract_changelog.py "${GITHUB_REF_NAME}" > release_notes.md

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: out

      - name: 判断是否已有同名 Release
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_REF_NAME} 的 Release 已存在，跳过创建（不覆盖已有资产）"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 Release
        if: steps.exists.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          # Tag 里带 -（beta/alpha/rc）就是预发布；纯正式版 Tag 才是 Latest
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          generate_release_notes: false
          files: out/*
